name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: glimmer
          POSTGRES_USER: glimmer
          POSTGRES_DB: glimmer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://glimmer:glimmer@localhost:5432/glimmer_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run dataforge
      - run: npm test
      - run: npm run build

  # Zha'elim has no dependencies and no build step, so it needs no install and
  # no database — just Node. Its rules are pure functions and its songs are
  # proved solvable rather than assumed to be.
  zhaelim:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test zhaelim/test/weave.test.js
      - run: node zhaelim/tools/verify-songs.mjs
