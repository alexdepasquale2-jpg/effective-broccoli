name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # Zha'elim has no dependencies and no build step, so it needs no install —
  # just Node. Its rules are pure functions, and its songs are proved solvable
  # rather than assumed to be.
  zhaelim:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test zhaelim/test/weave.test.js
      - run: node zhaelim/tools/verify-songs.mjs
