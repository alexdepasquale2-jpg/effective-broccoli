<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0618" />
    <meta
      name="description"
      content="Aether — a 4D arcade roguelite. Fold between slices, stack boons, dodge thick space."
    />
    <title>Aether</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Aether game canvas"></canvas>

      <div id="hud" hidden>
        <div class="hud-block">
          <span class="hud-label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="hud-block hud-block-right">
          <span class="hud-label">Best</span>
          <span id="best">0</span>
        </div>
        <div id="slice-chip">ANA</div>
        <div id="combo" hidden>x2</div>
        <div id="relics"></div>
      </div>

      <button id="fold" type="button" hidden>
        <span id="fold-label">FOLD</span>
        <span class="fold-hint">tap</span>
      </button>

      <div id="draft" class="draft" hidden>
        <p class="eyebrow">A new axis opens</p>
        <h2>Take a boon</h2>
        <p class="hint">Stacks if you already have it. Curses pay in chaos.</p>
        <div id="boon-row"></div>
      </div>

      <div id="overlay" class="overlay">
        <div class="panel">
          <p class="eyebrow">4D roguelite · 2D plane</p>
          <h1 id="title">Aether</h1>
          <p id="subtitle" class="subtitle">Fold through slices. Stack cursed boons. Do not get thick.</p>
          <p id="result" class="result" hidden></p>
          <button id="play" type="button">Play</button>
          <p class="hint">Drag to move · Tap FOLD to swap ANA/KATA · Pick a boon every few orbs</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
