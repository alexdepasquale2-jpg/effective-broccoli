<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
<meta name="theme-color" content="#060c08" />
<meta name="description" content="Grid-based sector defence — a mobile-first web game foundation." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Sector Command</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Sector grid" role="img"></canvas>

    <!-- DOM overlay: HUD and panels live here so they stay crisp and accessible -->
    <div id="ui" class="ui">
      <div id="hud" class="hud hidden">
        <div class="hud-row">
          <div class="hud-block">
            <span class="lbl">OPS</span>
            <span class="hud-score" id="hud-score">00000</span>
          </div>
          <div class="hud-block right">
            <span class="lbl">MULT</span>
            <span class="hud-combo" id="hud-combo">x1</span>
          </div>
          <button class="hud-btn" id="btn-pause" type="button" aria-label="Hold">| |</button>
        </div>
        <div class="hud-row">
          <div class="hud-block">
            <span class="lbl">INTEGRITY</span>
            <span class="integrity" id="hud-integrity"></span>
          </div>
        </div>
        <div class="cooldown-track"><i class="cooldown-fill" id="hud-cooldown"></i></div>
        <!-- Pinned to the bottom of the screen, so it is out of the top HUD's
             flow and can never crowd the board's column labels. -->
        <p class="status" id="hud-status">SECTORS NOMINAL</p>
      </div>

      <div id="panel-menu" class="panel">
        <p class="stencil">OPERATION</p>
        <h1 class="title">SECTOR<span>COMMAND</span></h1>
        <ul class="brief">
          <li><i class="key hostile"></i> HOSTILE &mdash; STRIKE THE SECTOR</li>
          <li><i class="key friendly"></i> ALLIED &mdash; HOLD YOUR FIRE</li>
        </ul>
        <button class="btn btn-primary" id="btn-play" type="button">DEPLOY</button>
        <p class="best">BEST <span id="menu-best">00000</span></p>
        <p class="hint">TAP A SECTOR &middot; ARROWS + SPACE ON DESKTOP</p>
      </div>

      <div id="panel-pause" class="panel hidden">
        <p class="stencil">STANDBY</p>
        <h2 class="title-sm">HOLD</h2>
        <button class="btn btn-primary" id="btn-resume" type="button">RESUME</button>
        <button class="btn" id="btn-quit" type="button">ABORT</button>
      </div>

      <div id="panel-over" class="panel hidden">
        <p class="stencil">DEBRIEF</p>
        <h2 class="title-sm">SECTORS LOST</h2>
        <p class="score-final" id="over-score">00000</p>
        <p class="best">BEST <span id="over-best">00000</span></p>
        <button class="btn btn-primary" id="btn-retry" type="button">REDEPLOY</button>
        <button class="btn" id="btn-menu" type="button">COMMAND</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
